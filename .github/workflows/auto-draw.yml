name: Auto Draw Lottery
on:
  schedule:
    - cron: '* * * * *'   # every minute (GitHub minimum is 5 mins in practice)
  workflow_dispatch:

jobs:
  autodraw:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Draw
        run: |
          curl -f -s "https://www.kismathub.com/api/cron/lottery-autodraw"
          echo "Triggered at $(date)"
